# agendor-proxy — Cloudflare Worker (login/sessão, catálogos, sync KV, CNPJ, etiquetas, e-mails do cron)
# Publicado pelo Cloudflare Workers Builds a cada push que altere esta pasta.
# ATENÇÃO: este arquivo é a configuração do Worker (bindings, cron, logs). Variáveis criadas no painel ficam (keep_vars)
# e os SEGREDOS (ADMIN_KEY, RESEND_API_KEY) também — o deploy não mexe neles.
name = "agendor-proxy"
main = "worker.js"
compatibility_date = "2026-06-12"
workers_dev = true
# Mantém as variáveis criadas no painel do Cloudflare (ex.: SYNC_EXIGE_SESSAO, CORS_EXTRA) a cada deploy pelo GitHub.
keep_vars = true

[vars]
MAIL_FROM = "TeamCheck <nao-responda@send.jordanmt.com>"

[[d1_databases]]
binding = "DASHBOARD_DB"
database_name = "dashboard-jordan-db"
database_id = "4af16706-40c2-4533-be1b-5d77725bafab"

[[kv_namespaces]]
binding = "SYNC_KV"
id = "5c62e3280a8c468395f26fa4c8a11b26"

# E-mail de tarefas pendentes: segunda, quarta e sexta, 11:00 UTC = 07:00 em Cuiabá
# (no painel aparece como "0 11 * * 2,4,6", que é o mesmo horário)
[triggers]
crons = ["0 11 * * MON,WED,FRI"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
